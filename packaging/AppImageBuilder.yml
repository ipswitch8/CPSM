# AppImageBuilder.yml — appimagetool configuration for CPSM
# Targets Ubuntu 24.04+ runtime (glibc >= 2.39)
#
# The apt base below determines which glibc appimage-builder bundles into
# runtime/compat/ and loads INSTEAD of the host's. That choice is not cosmetic:
# a build on the jammy (22.04 / glibc 2.35) base leaked ~437 MB/day under
# CPSM's 3-second status poll, while the identical PyInstaller binary running
# against the host glibc 2.40 leaked nothing measurable. See
# docs/MEMORY-LEAK-INVESTIGATION.md.
#
# TRADE-OFF: raising the base also raises the MINIMUM glibc a target system
# needs. A noble-based build will not start on Ubuntu 22.04. That is the
# deliberate cost of not shipping a leaking allocator.
# Prerequisites:
#   - PyInstaller one-folder dist already produced at dist/cpsm/
#   - appimage-builder installed (pip install appimage-builder)
# Usage:
#   appimage-builder --recipe packaging/AppImageBuilder.yml --skip-tests

version: 1

# Pre-population step: copy the PyInstaller bundle into the AppDir before
# appimage-builder runs apt etc.  The cpsm binary expects a sibling
# ``_internal/`` directory, so both must end up under usr/bin together.
script:
  - rm -rf AppDir
  - mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/metainfo AppDir/usr/share/cpsm
  - cp -r dist/cpsm/. AppDir/usr/bin/
  - cp cpsm/resources/icons/cpsm.svg AppDir/usr/share/icons/hicolor/scalable/apps/cpsm.svg
  - cp cpsm/resources/icons/cpsm.svg AppDir/cpsm.svg
  # AGPLv3 §4/§6 require conveying a copy of the license with the binary.
  # Lives at usr/share/cpsm/ (not usr/share/doc/cpsm/) to dodge the
  # ``files.exclude: usr/share/doc`` rule that strips apt-deployed docs.
  - cp LICENSE AppDir/usr/share/cpsm/LICENSE
  - cp README.md AppDir/usr/share/cpsm/README.md

AppDir:
  path: ./AppDir

  app_info:
    id: net.itwerx.cpsm
    name: cpsm
    icon: cpsm
    # CPSM_VERSION is REQUIRED — see the note on AppImage.file_name below.
    # appimage-builder's !ENV loader only understands bare ${VAR}; a
    # ``${VAR:-default}`` never matches its pattern and is embedded verbatim,
    # which is how every previous build ended up reporting its version as the
    # literal string "${CPSM_VERSION:-0.1.0}". Requiring the variable turns
    # that silent corruption into a loud RecipeError.
    version: !ENV '${CPSM_VERSION}'
    exec: usr/bin/cpsm
    exec_args: $@

  apt:
    arch: amd64
    sources:
      # noble = Ubuntu 24.04 LTS = glibc 2.39 (supported to 2029).
      # Do NOT move this back to jammy without re-measuring the leak.
      - sourceline: deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe
        key_url: http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C

    include:
      # Minimal runtime libraries — the PyInstaller bundle ships its own Python
      # but still links against system libssl / libcrypto for cryptography.
      #
      # NOTE: noble (24.04) carried out the 64-bit time_t transition, which
      # renamed several library packages with a ``t64`` suffix. These names are
      # noble-correct and would NOT resolve on jammy.
      - libssl3t64
      - libcrypt1
      - libglib2.0-0t64
      # D-Bus / SecretService for keyring
      - libdbus-1-3
      - libsecret-1-0
      # Qt / PySide6 system GL
      - libgl1
      - libegl1

  files:
    exclude:
      - usr/share/doc
      - usr/share/man
      - usr/share/locale
      # systemd / init bits pulled in by libdbus-1-3 transitively but never
      # needed at runtime — strip to save ~20 MB.
      - usr/lib/systemd
      - usr/lib/kernel
      - etc/init.d

  runtime:
    env:
      QT_QPA_PLATFORM: xcb
      LD_LIBRARY_PATH: $APPDIR/usr/bin/_internal:$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu

AppImage:
  arch: x86_64
  # Output filename pattern: CPSM-<version>-x86_64.AppImage
  #
  # Two rules, both learned the hard way (see appimagebuilder/recipe/loader.py):
  #
  #  1. The !ENV tag must PRECEDE the whole quoted scalar. A YAML tag applies
  #     to the node it introduces, so ``CPSM-!ENV ${VAR}-...`` puts it
  #     mid-string where YAML treats it as literal text — producing a file
  #     literally named ``CPSM-!ENV ${CPSM_VERSION:-0.1.0}-x86_64.AppImage``
  #     that had to be renamed by hand after every build.
  #  2. The loader's pattern is ``\${(\w+)}`` — bare ${VAR} only. A shell-style
  #     ``${VAR:-default}`` does not match, so it is left verbatim rather than
  #     defaulted. Hence no default here; CPSM_VERSION must be set:
  #
  #       CPSM_VERSION=0.1.0 appimage-builder --recipe packaging/AppImageBuilder.yml
  file_name: !ENV 'CPSM-${CPSM_VERSION}-x86_64.AppImage'
