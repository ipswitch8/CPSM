name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload release assets

jobs:
  # --------------------------------------------------------------------------
  # Linux: PyInstaller → AppImage
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps for PySide6 / Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libdbus-1-3 libsecret-1-0 \
            libglib2.0-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e '.[dev,linux]'

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build PyInstaller one-folder dist
        run: |
          pyinstaller --noconfirm packaging/cpsm.spec

      - name: Smoke-test Linux binary
        run: |
          ./dist/cpsm/cpsm --version

      - name: Check the bundle carries no build-machine paths
        # Must run AFTER the PyInstaller build. The test skips when
        # dist/cpsm/ is absent, so putting it in the normal CI workflow
        # (which never builds a bundle) would pass without checking
        # anything at all -- which is exactly what it did before.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/packaging/test_bundle_has_no_build_paths.py -q --no-cov

      - name: Build AppImage
        # NOT appimage-builder: its AppRun LD_PRELOADs libapprun_hooks.so,
        # which leaks ~413 MB/day. See docs/MEMORY-LEAK-INVESTIGATION.md.
        env:
          CPSM_VERSION: ${{ steps.version.outputs.version }}
          # appimagetool is itself an AppImage, and GitHub runners have no
          # FUSE. Without this it dies with "dlopen(): error loading
          # libfuse.so.2" before producing anything.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash scripts/build_appimage_plain.sh

      - name: Upload AppImage and installer as release assets
        uses: softprops/action-gh-release@v2
        with:
          # install.sh belongs here too: the README tells people to download
          # both, and an automated release that ships only the AppImage
          # leaves them without the installer the Quick Start references.
          files: |
            CPSM-${{ steps.version.outputs.version }}-x86_64.AppImage
            install.sh

  # --------------------------------------------------------------------------
  # Windows: PyInstaller → WiX MSI
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows MSI
    runs-on: windows-2022

    # DISABLED. The MSI has never built successfully, so releasing from this
    # job would attach nothing and mark every release run red.
    #
    # The WiX source is kept, not deleted: packaging/wix/cpsm.wxs has since
    # been corrected for the errors that were blocking it (an unresolved
    # WixUI_ProgressOnly reference, then ICE38/ICE64 per-user-install
    # defects). What is not known is whether the heat.exe-generated component
    # fragment hits ICE38 for the same reason MainExecutable did — that needs
    # someone iterating against a real Windows build, not a tag push at a
    # time against a public repo.
    #
    # To re-enable: set the repository variable ENABLE_WINDOWS_MSI to "true"
    #   gh variable set ENABLE_WINDOWS_MSI --body true --repo <owner>/<repo>
    # Leaving it unset skips the job cleanly; the release still publishes the
    # Linux assets.
    if: ${{ vars.ENABLE_WINDOWS_MSI == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e '.[dev,windows]'

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build PyInstaller one-folder dist
        run: |
          pyinstaller --noconfirm packaging/cpsm.spec

      - name: Smoke-test Windows binary
        run: |
          .\dist\cpsm\cpsm.exe --version

      - name: Install WiX toolset
        run: |
          dotnet tool install --global wix --version 4.0.5 || true
          # Fall back to WiX 3.x via chocolatey if available
          choco install wixtoolset --version 3.14.1 -y --no-progress 2>$null || true

      - name: Enumerate dist files for WiX (heat)
        shell: cmd
        run: |
          heat.exe dir dist\cpsm ^
            -nologo -srd -gg -sfrag -sreg ^
            -cg ApplicationFiles ^
            -dr INSTALLFOLDER ^
            -out packaging\wix\ApplicationFiles.wxs

      - name: Compile WiX sources
        shell: cmd
        run: |
          candle.exe -nologo ^
            -dVersion=${{ steps.version.outputs.version }} ^
            -dSourceDir=dist\cpsm ^
            -arch x64 ^
            packaging\wix\cpsm.wxs ^
            packaging\wix\ApplicationFiles.wxs ^
            -out packaging\wix\

      - name: Link MSI
        shell: cmd
        run: |
          light.exe -nologo ^
            -ext WixUIExtension ^
            packaging\wix\cpsm.wixobj ^
            packaging\wix\ApplicationFiles.wixobj ^
            -out CPSM-${{ steps.version.outputs.version }}-x64.msi

      - name: Code-sign MSI (placeholder)
        # Set SIGN_CERT_PATH / SIGN_CERT_PASSWORD as encrypted repo secrets.
        # Skip silently if the certificate secret is not configured.
        if: ${{ env.SIGN_CERT_PATH != '' }}
        env:
          SIGN_CERT_PATH: ${{ secrets.SIGN_CERT_PATH }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        shell: cmd
        run: |
          signtool.exe sign ^
            /fd sha256 ^
            /f "%SIGN_CERT_PATH%" ^
            /p "%SIGN_CERT_PASSWORD%" ^
            /tr http://timestamp.digicert.com ^
            /td sha256 ^
            CPSM-${{ steps.version.outputs.version }}-x64.msi

      - name: Upload MSI as release asset
        uses: softprops/action-gh-release@v2
        with:
          files: CPSM-${{ steps.version.outputs.version }}-x64.msi
