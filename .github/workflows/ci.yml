name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type:
    name: Lint and type-check (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff (lint)
        run: ruff check cpsm tests

      - name: Ruff (format check)
        run: ruff format --check cpsm tests

      - name: Mypy (type-check)
        run: mypy cpsm

  # ---------------------------------------------------------------------------
  # Deliberately its own job, not a step of lint-and-type.
  #
  # It used to be the last step there, which meant the ruff failure at step
  # one stopped it from ever running -- this guard was dormant for every
  # commit from the initial publish until it was moved here. A disclosure
  # check on a public repo must not sit downstream of a formatting check.
  # ---------------------------------------------------------------------------
  disclosure-lint:
    name: Infrastructure-disclosure lint
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pytest-qt imports QtGui during pytest_configure, so every pytest
      # invocation in this repo needs the Qt runtime libraries even when the
      # selected tests touch no GUI code at all. Without these the run dies
      # with INTERNALERROR ImportError: libEGL.so.1.
      - name: Install system deps for Qt headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Infrastructure-disclosure lint
        # This repo is public and its fixtures are easy to seed by pasting
        # from a real ~/.cpsm.yaml. Fail the build if a routable IP, a vendor
        # key name, or a developer home path reaches a tracked file.
        # See tests/lint/test_no_real_infrastructure.py for the rationale.
        run: pytest tests/lint/test_no_real_infrastructure.py -q --no-cov

  test-linux:
    name: Test on Linux (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system deps for Qt headless
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            tmux

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Smoke — `python -m cpsm --version`
        run: python -m cpsm --version

      - name: Pytest
        run: pytest -q

  test-windows:
    name: Test on Windows (${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Smoke — `python -m cpsm --version`
        run: python -m cpsm --version

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -m "not integration"
